name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: '10.0.302'
  SOLUTION: KeyboardStudio.slnx
  BUILD_CONFIGURATION: Release

jobs:
  managed-build:
    name: Managed build (self-hosted Linux x64)
    # Prefer the repository's self-hosted pool. GitHub matches all three
    # labels, so the job can run on any registered Linux x64 host rather than
    # being tied to one machine-specific runner label.
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # The keysym table is generated from the pinned sources in third_party/keysyms and
      # committed. Regenerating and diffing is what stops the committed file and its sources
      # drifting apart, which nothing else would notice: a stale table imports layouts that
      # look plausible and are quietly wrong.
      - name: Verify the generated keysym table
        run: python3 scripts/generate-keysym-table.py --check

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test managed suites
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --filter "Category=Unit|Category=Golden"

  xkb-integration:
    name: XKB integration (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install XKB verification tools
        run: ./scripts/install-xkbcli.sh

      - name: Restore
        run: dotnet restore tests/KeyboardStudio.Linux.Tests/KeyboardStudio.Linux.Tests.csproj

      - name: Test generated XKB layouts
        run: dotnet test tests/KeyboardStudio.Linux.Tests/KeyboardStudio.Linux.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity normal --filter "Category=XkbIntegration"

      - name: Retain failed XKB artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xkb-integration-failures
          path: '**/TestResults/xkb-integration/**'
          if-no-files-found: ignore

  windows-integration:
    name: Windows native integration
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Locate MSVC and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere."
          }

          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installation)) {
            throw "A Visual Studio installation with the MSVC x64 toolchain was not found."
          }

          $kitsRoot = Get-ItemPropertyValue `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' `
            -Name KitsRoot10
          if ([string]::IsNullOrWhiteSpace($kitsRoot) -or -not (Test-Path $kitsRoot)) {
            throw "The Windows 10/11 SDK root was not found."
          }

          "MSVC installation: $installation" >> $env:GITHUB_STEP_SUMMARY
          "Windows SDK root: $kitsRoot" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test managed suites
        run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --filter "Category=Unit|Category=Golden"

      - name: Compile and verify generated keyboard DLL
        run: dotnet test tests/KeyboardStudio.Windows.Tests/KeyboardStudio.Windows.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --filter "Category=WindowsIntegration"

      - name: Retain failed Windows native diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-integration-failures-${{ github.run_attempt }}
          path: '**/TestResults/windows-integration/**'
          if-no-files-found: ignore
          retention-days: 7

  package-linux:
    name: Package desktop app (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Restore Linux runtime
        run: dotnet restore src/KeyboardStudio.App/KeyboardStudio.App.csproj --runtime linux-x64

      - name: Read application version
        id: version
        run: echo "value=$(dotnet msbuild src/KeyboardStudio.App/KeyboardStudio.App.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained app
        run: >-
          dotnet publish src/KeyboardStudio.App/KeyboardStudio.App.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64

      - name: Smoke-test packaged app
        run: artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64/KeyboardStudio --version

      - name: Smoke-test desktop startup
        run: |
          set +e
          xvfb-run --auto-servernum timeout 5s \
            artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64/KeyboardStudio
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            echo "Packaged application exited unexpectedly with code $exit_code." >&2
            exit 1
          fi

      - name: Archive package
        run: >-
          tar -C artifacts
          -czf artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64.tar.gz
          KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64
          path: artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-linux-x64.tar.gz
          if-no-files-found: error

  package-windows:
    name: Package desktop app (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore Windows runtime
        run: dotnet restore src/KeyboardStudio.App/KeyboardStudio.App.csproj --runtime win-x64

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/KeyboardStudio.App/KeyboardStudio.App.csproj -getProperty:Version
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained app
        run: >-
          dotnet publish src/KeyboardStudio.App/KeyboardStudio.App.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64

      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $executable = 'artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64/KeyboardStudio.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged application version check failed with exit code $($process.ExitCode)."
          }

      - name: Smoke-test desktop startup
        shell: pwsh
        run: |
          $executable = 'artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64/KeyboardStudio.exe'
          $process = Start-Process -FilePath $executable -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged application exited unexpectedly with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id
          $process.WaitForExit()

      - name: Archive package
        shell: pwsh
        run: >-
          Compress-Archive
          -Path artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64/*
          -DestinationPath artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: KeyboardStudio-${{ steps.version.outputs.value }}-win-x64
          path: artifacts/KeyboardStudio-${{ steps.version.outputs.value }}-win-x64.zip
          if-no-files-found: error

  mvp-release-gate:
    name: MVP release gate
    if: always()
    needs:
      - managed-build
      - xkb-integration
      - windows-integration
      - package-linux
      - package-windows
    runs-on: ubuntu-latest

    steps:
      - name: Require all MVP jobs
        env:
          MANAGED_RESULT: ${{ needs.managed-build.result }}
          XKB_RESULT: ${{ needs.xkb-integration.result }}
          WINDOWS_RESULT: ${{ needs.windows-integration.result }}
          LINUX_PACKAGE_RESULT: ${{ needs.package-linux.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.package-windows.result }}
        run: |
          for result in \
            "$MANAGED_RESULT" \
            "$XKB_RESULT" \
            "$WINDOWS_RESULT" \
            "$LINUX_PACKAGE_RESULT" \
            "$WINDOWS_PACKAGE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "An MVP prerequisite job finished with result: $result" >&2
              exit 1
            fi
          done
          echo "All managed, native integration, and packaging jobs passed." >> "$GITHUB_STEP_SUMMARY"
